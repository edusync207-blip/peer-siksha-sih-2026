<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Together</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Opening Page -->
    <section class="welcome-page">

        <div class="logo">
            📚 🧠 🤝
        </div>

        <h1>STUDY TOGETHER</h1>

        <p class="tagline">
            Learn • Study • Grow Together
        </p>

        <p class="description">
            Learn together.<br>
            Study smarter.<br>
            Achieve together.
        </p>

        <div class="features">

            <div class="feature">
                <span>📚</span>
                <p>Learn</p>
            </div>

            <div class="feature">
                <span>📝</span>
                <p>Practice</p>
            </div>

            <div class="feature">
                <span>🤝</span>
                <p>Study Together</p>
            </div>

            <div class="feature">
                <span>📊</span>
                <p>Track Progress</p>
            </div>

            <div class="feature">
                <span>🎯</span>
                <p>Achieve Goals</p>
            </div>

        </div>

        <p class="loading">
            Loading your learning journey...
        </p>

    </section>


    <!-- Student Login/Profile Page -->
    <section class="login-page" id="loginPage">

        <div class="login-box">

            <div class="login-logo">📚</div>

            <h2>Welcome to Study Together</h2>

            <p>Let's create your learning profile</p>

            <form>

                <label>Student Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Course</label>
                <input type="text" placeholder="Example: B.Tech">

                <label>Year</label>
                <select>
                    <option>Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>

                <label>Subjects</label>
                <input type="text" placeholder="Example: Java, DBMS, Maths">

                <button type="submit">
                    Continue
                </button>

            </form>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
